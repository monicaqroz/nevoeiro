name: Atualizar estatísticas do site

on:
  schedule:
    - cron: '0 9 * * *' # 05:00 em Manaus (UTC-4)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Coletar estatísticas do GoatCounter
        env:
          GOATCOUNTER_API_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
        run: node scripts/scrape-estatisticas-site.js

      - name: Commitar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/estatisticas-site.json estatisticas.html; then
            echo "Sem novidades nas estatísticas."
            exit 0
          fi
          git add data/estatisticas-site.json estatisticas.html
          git commit -m "Atualiza estatísticas do site"
          git pull --rebase origin main
          git push
