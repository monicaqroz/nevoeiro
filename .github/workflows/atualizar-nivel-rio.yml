name: Atualizar nível do Rio Negro

on:
  schedule:
    - cron: '0 14 * * *' # 10:00 em Manaus (UTC-4)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Coletar dados do nível do rio
        run: node scripts/scrape-nivel-rio.js

      - name: Commitar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/nivel-rio-negro.json; then
            echo "Sem novidades no nível do rio."
            exit 0
          fi
          git add data/nivel-rio-negro.json
          git commit -m "Atualiza nível do Rio Negro"
          git push
